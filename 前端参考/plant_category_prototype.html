<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>植物记录相机 - 分组</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #f5f5f5;
      max-width: 435px;
      margin: 0 auto;
      position: relative;
      min-height: 100vh;
    }

    /* ========== 顶部栏 ========== */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      max-width: 435px;
      margin: 0 auto;
      height: 50px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 100;
      border-bottom: 1px solid #f0f0f0;
    }

    .top-left {
      width: 40px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .top-left svg {
      width: 22px;
      height: 22px;
      fill: #333;
      cursor: pointer;
    }

    .sort-tabs {
      display: flex;
      gap: 30px;
    }

    .sort-tab {
      font-size: 16px;
      color: #999;
      cursor: pointer;
      padding: 4px 0;
      position: relative;
      background: none;
      border: none;
      font-weight: normal;
    }

    .sort-tab.active {
      color: #333;
      font-weight: 600;
    }

    .sort-tab.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2px;
      background: #FF4040;
      border-radius: 1px;
    }

    .top-right {
      width: 40px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .search-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-btn svg {
      width: 20px;
      height: 20px;
      fill: #666;
    }

    /* ========== 瀑布流 - 三列固定比例 ========== */
    .category-container {
      padding: 8px;
      padding-top: 58px;
      padding-bottom: 70px;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      gap: 8px;
    }

    .category-column {
      width: 33.33%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .group-card {
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
      break-inside: avoid;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }

    .group-card-image {
      width: 100%;
      aspect-ratio: 1 / 1.2;
      object-fit: cover;
      display: block;
      background: #e8e8e8;
    }

    .group-card-content {
      padding: 8px 6px;
    }

    .group-card-title {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 2px;
    }

    .group-card-count {
      font-size: 11px;
      color: #999;
    }

    /* 分组标签样式 */
    .group-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(135deg, #4CAF50 0%, #8BC34A 100%);
    }

    .group-card:nth-child(3n+2)::before {
      background: linear-gradient(135deg, #FF9800 0%, #FFC107 100%);
    }

    .group-card:nth-child(3n)::before {
      background: linear-gradient(135deg, #2196F3 0%, #03A9F4 100%);
    }

    /* ========== 底部导航栏 ========== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 435px;
      margin: 0 auto;
      height: 50px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 0);
      border-top: 1px solid #f0f0f0;
    }

    .nav-item {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      cursor: pointer;
      padding: 8px 0;
      background: none;
      border: none;
      font-size: 12px;
      color: #999;
      position: relative;
    }

    .nav-item.active {
      color: #333;
    }

    /* 加号按钮特殊样式 */
    .nav-item.plus-btn {
      position: relative;
    }

    .plus-btn .plus-icon-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: #FF4040;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(255, 64, 64, 0.3);
      border: none;
      cursor: pointer;
    }

    .plus-btn .plus-icon-wrapper svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }

    /* ========== 添加选项弹窗 ========== */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 250;
    }

    .overlay.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    .add-options {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 411px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      z-index: 300;
      display: none;
    }

    .add-options.active {
      display: block;
    }

    .add-option {
      width: 100%;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: #333;
    }

    .add-option:not(:last-child) {
      border-bottom: 1px solid #f5f5f5;
    }

    .add-option svg {
      width: 20px;
      height: 20px;
      fill: #4CAF50;
    }

    .add-option.cancel {
      color: #999;
      margin-top: 6px;
      border-top: 6px solid #f5f5f5;
      border-bottom: none;
    }

    .add-option.cancel svg {
      fill: #999;
    }

    /* ========== 搜索页面 ========== */
    .search-page {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 435px;
      margin: 0 auto;
      background: #fff;
      z-index: 200;
    }

    .search-page.active {
      display: block;
    }

    .search-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      max-width: 435px;
      margin: 0 auto;
      height: 50px;
      background: #fff;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 12px;
      z-index: 201;
      border-bottom: 1px solid #f0f0f0;
    }

    .search-input {
      flex: 1;
      height: 32px;
      padding: 0 14px;
      border: none;
      background: #f5f5f5;
      border-radius: 16px;
      font-size: 13px;
    }

    .search-input:focus {
      outline: none;
    }

    .cancel-search {
      font-size: 14px;
      color: #666;
      background: none;
      border: none;
      cursor: pointer;
    }

    .search-content {
      padding-top: 58px;
    }

    .search-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 20px;
      color: #999;
    }

    .search-empty svg {
      width: 64px;
      height: 64px;
      fill: #ddd;
      margin-bottom: 16px;
    }

    /* ========== "我" 页面 ========== */
    .profile-page {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 435px;
      margin: 0 auto;
      background: #f5f5f5;
      z-index: 200;
    }

    .profile-page.active {
      display: block;
    }

    .profile-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      max-width: 435px;
      margin: 0 auto;
      height: 50px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      z-index: 201;
      border-bottom: 1px solid #f0f0f0;
    }

    .profile-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .profile-content {
      padding-top: 58px;
      padding-bottom: 20px;
    }

    .profile-stats {
      background: #fff;
      padding: 20px;
      display: flex;
      justify-content: space-around;
      margin-bottom: 1px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }

    .stat-label {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }

    .profile-card {
      background: #fff;
      margin-bottom: 1px;
    }

    .profile-card-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      padding: 14px 12px;
      border-bottom: 1px solid #f5f5f5;
    }

    .profile-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 12px;
      background: #fff;
      margin-bottom: 1px;
    }

    .profile-list-item span:first-child {
      font-size: 14px;
      color: #333;
    }

    .profile-list-item span:last-child {
      font-size: 14px;
      color: #ccc;
    }

    /* ========== 分组内个体列表页面 ========== */
    .group-detail-page {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 435px;
      margin: 0 auto;
      background: #f5f5f5;
      z-index: 200;
    }

    .group-detail-page.active {
      display: block;
    }

    .group-detail-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      max-width: 435px;
      margin: 0 auto;
      height: 50px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 201;
      border-bottom: 1px solid #f0f0f0;
    }

    .back-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
      fill: #333;
    }

    .group-detail-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .edit-group-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .edit-group-btn svg {
      width: 20px;
      height: 20px;
      fill: #333;
    }

    .group-detail-content {
      padding-top: 58px;
      padding-bottom: 70px;
    }

    .group-info-card {
      background: #fff;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      gap: 12px;
    }

    .group-info-image {
      width: 80px;
      height: 80px;
      border-radius: 6px;
      object-fit: cover;
      background: #e8e8e8;
    }

    .group-info-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .group-info-title {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }

    .group-info-desc {
      font-size: 12px;
      color: #666;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .group-info-stats {
      font-size: 11px;
      color: #999;
      margin-top: 6px;
    }

    .individuals-section {
      padding: 8px;
    }

    .individuals-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      padding: 8px 0;
    }

    /* 两列瀑布流 - 与首页一致 */
    .individuals-masonry {
      display: flex;
      gap: 8px;
    }

    .individuals-column {
      width: calc(50% - 4px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .individual-card {
      background: #fff;
      border-radius: 4px;
      overflow: hidden;
    }

    .individual-card-image {
      width: 100%;
      display: block;
    }

    .individual-card-content {
      padding: 10px 8px;
    }

    .individual-card-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .individual-card-count {
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>

  <!-- ========== 分组页面 ========== -->
  <div id="categoryPage">
    <!-- 顶部栏 -->
    <div class="top-bar">
      <div class="top-left">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>

      <div class="sort-tabs">
        <button class="sort-tab active" data-sort="default">默认</button>
        <button class="sort-tab" data-sort="hot">最热</button>
        <button class="sort-tab" data-sort="latest">最新</button>
      </div>

      <div class="top-right">
        <button class="search-btn" id="searchBtn">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </div>
    </div>

    <!-- 三列分组列表 -->
    <div class="category-container" id="categoryContainer">
      <!-- 由 JS 渲染 -->
    </div>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <button class="nav-item" id="homeBtn">
        <span>全部</span>
      </button>
      <button class="nav-item active" id="categoryBtn">
        <span>分组</span>
      </button>
      <button class="nav-item plus-btn" id="plusBtn">
        <div class="plus-icon-wrapper">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </div>
      </button>
      <button class="nav-item" id="communityBtn">
        <span>社区</span>
      </button>
      <button class="nav-item" id="profileBtn">
        <span>我</span>
      </button>
    </nav>
  </div>

  <!-- ========== 添加选项弹窗 ========== -->
  <div class="overlay" id="addOverlay"></div>
  <div class="add-options" id="addOptions">
    <button class="add-option" id="addGroupOption">
      <svg viewBox="0 0 24 24"><path d="M12 22c4.97 0 9-4.03 9-9-4.97 0-9 4.03-9 9zM5.6 10.25c0 1.38 1.12 2.5 2.5 2.5.53 0 1.01-.16 1.42-.44l-.02.19c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5l-.02-.19c.4.28.89.44 1.42.44 1.38 0 2.5-1.12 2.5-2.5 0-1-.59-1.85-1.43-2.25.84-.4 1.43-1.25 1.43-2.25 0-1.38-1.12-2.5-2.5-2.5-.53 0-1.01.16-1.42.44l.02-.19C14.5 4.12 13.38 3 12 3S9.5 4.12 9.5 5.5l.02.19c-.4-.28-.89-.44-1.42-.44-1.38 0-2.5 1.12-2.5 2.5 0 1 .59 1.85 1.43 2.25-.84.4-1.43 1.25-1.43 2.25zM12 5.5c1.38 0 2.5 1.12 2.5 2.5s-1.12 2.5-2.5 2.5S9.5 9.38 9.5 8s1.12-2.5 2.5-2.5zM3 13c0 4.97 4.03 9 9 9 0-4.97-4.03-9-9-9z"/></svg>
      新建分组
    </button>
    <button class="add-option" id="addIndividualOption">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      新建个体
    </button>
    <button class="add-option cancel" id="cancelAddOption">
      取消
    </button>
  </div>

  <!-- ========== 搜索页面 ========== -->
  <div class="search-page" id="searchPage">
    <header class="search-header">
      <input type="text" class="search-input" id="searchInput" placeholder="搜索">
      <button class="cancel-search" id="cancelSearchBtn">取消</button>
    </header>
    <div class="search-content">
      <div class="search-empty">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <p>输入关键词搜索</p>
      </div>
    </div>
  </div>

  <!-- ========== "我" 页面 ========== -->
  <div class="profile-page" id="profilePage">
    <header class="profile-header">
      <button class="back-btn" id="closeProfileBtn" style="position: absolute; left: 12px;">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <span class="profile-title">我</span>
    </header>
    <div class="profile-content">
      <div class="profile-stats">
        <div class="stat-item">
          <div class="stat-value" id="totalGroups">0</div>
          <div class="stat-label">分组</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="totalIndividuals">0</div>
          <div class="stat-label">个体</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="totalRecords">0</div>
          <div class="stat-label">记录</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="totalViews">0</div>
          <div class="stat-label">浏览</div>
        </div>
      </div>

      <div class="profile-card">
        <div class="profile-card-title">存储统计</div>
      </div>
      <div class="profile-list-item">
        <span>图片数量</span>
        <span id="totalImages">0 张</span>
      </div>
      <div class="profile-list-item">
        <span>占用空间</span>
        <span id="storageSize">0 MB</span>
      </div>

      <div class="profile-card" style="margin-top: 10px;">
        <div class="profile-card-title">关于</div>
        <div class="profile-list-item">
          <span>版本</span>
          <span>1.0.0</span>
        </div>
        <div class="profile-list-item">
          <span>应用名称</span>
          <span>植物记录相机</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== 分组详情页 ========== -->
  <div class="group-detail-page" id="groupDetailPage">
    <header class="group-detail-header">
      <button class="back-btn" id="closeGroupDetailBtn">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <span class="group-detail-title" id="groupDetailTitle">分组名称</span>
      <button class="edit-group-btn" id="editGroupBtn">
        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      </button>
    </header>

    <div class="group-detail-content">
      <div class="group-info-card">
        <img class="group-info-image" id="groupInfoImage" src="" alt="">
        <div class="group-info-text">
          <div class="group-info-title" id="groupInfoTitle"></div>
          <div class="group-info-desc" id="groupInfoDesc"></div>
          <div class="group-info-stats" id="groupInfoStats"></div>
        </div>
      </div>

      <div class="individuals-section">
        <div class="individuals-title">个体列表</div>
        <div class="individuals-masonry" id="individualsMasonry">
          <div class="individuals-column" id="individualsColumn1"></div>
          <div class="individuals-column" id="individualsColumn2"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 示例分组数据
    const groupData = [
      { id: 1, title: '多肉植物', count: 12, image: 'https://picsum.photos/300/360?random=1', views: 2341 },
      { id: 2, title: '绿萝养护', count: 8, image: 'https://picsum.photos/300/360?random=2', views: 1234 },
      { id: 3, title: '月季花园', count: 15, image: 'https://picsum.photos/300/360?random=3', views: 3456 },
      { id: 4, title: '仙人掌科', count: 6, image: 'https://picsum.photos/300/360?random=4', views: 876 },
      { id: 5, title: '吊兰繁殖', count: 9, image: 'https://picsum.photos/300/360?random=5', views: 1567 },
      { id: 6, title: '龟背竹', count: 5, image: 'https://picsum.photos/300/360?random=6', views: 2890 },
      { id: 7, title: '虎皮兰', count: 7, image: 'https://picsum.photos/300/360?random=7', views: 943 },
      { id: 8, title: '琴叶榕', count: 4, image: 'https://picsum.photos/300/360?random=8', views: 1123 },
      { id: 9, title: '发财树', count: 11, image: 'https://picsum.photos/300/360?random=9', views: 1876 },
    ];

    // 示例个体数据
    const individualData = [
      { id: 1, groupId: 1, title: '桃蛋', count: 8, image: 'https://picsum.photos/300/360?random=11' },
      { id: 2, groupId: 1, title: '熊童子', count: 5, image: 'https://picsum.photos/300/360?random=12' },
      { id: 3, groupId: 1, title: '玉露', count: 12, image: 'https://picsum.photos/300/360?random=13' },
      { id: 4, groupId: 2, title: '土培绿萝', count: 6, image: 'https://picsum.photos/300/360?random=14' },
      { id: 5, groupId: 2, title: '水培绿萝', count: 4, image: 'https://picsum.photos/300/360?random=15' },
      { id: 6, groupId: 3, title: '红色月季', count: 9, image: 'https://picsum.photos/300/360?random=16' },
    ];

    let currentSort = 'default';
    let currentGroupId = null;

    // 渲染三列分组列表
    function renderCategory() {
      const container = document.getElementById('categoryContainer');
      const columns = [[], [], []];

      // 排序
      let sortedData = [...groupData];
      if (currentSort === 'hot') {
        sortedData.sort((a, b) => b.views - a.views);
      } else if (currentSort === 'latest') {
        sortedData.sort((a, b) => b.id - a.id);
      }

      // 分配到三列
      sortedData.forEach((item, index) => {
        columns[index % 3].push(item);
      });

      // 清空
      container.innerHTML = '';

      // 创建三列
      for (let i = 0; i < 3; i++) {
        const column = document.createElement('div');
        column.className = 'category-column';

        columns[i].forEach(item => {
          const card = document.createElement('div');
          card.className = 'group-card';
          card.innerHTML = `
            <img class="group-card-image" src="${item.image}" alt="${item.title}" loading="lazy">
            <div class="group-card-content">
              <div class="group-card-title">${item.title}</div>
              <div class="group-card-count">${item.count} 个体</div>
            </div>
          `;

          card.addEventListener('click', () => openGroupDetail(item.id));
          column.appendChild(card);
        });

        container.appendChild(column);
      }
    }

    // 打开分组详情
    function openGroupDetail(groupId) {
      const group = groupData.find(g => g.id === groupId);
      if (!group) return;

      currentGroupId = groupId;

      document.getElementById('groupDetailTitle').textContent = group.title;
      document.getElementById('groupInfoImage').src = group.image;
      document.getElementById('groupInfoTitle').textContent = group.title;
      document.getElementById('groupInfoDesc').textContent = `收录 ${group.count} 个植物个体的生长记录`;
      document.getElementById('groupInfoStats').textContent = `${group.count} 个个体 · ${group.views} 次浏览`;

      // 渲染个体列表 - 两列瀑布流
      const individuals = individualData.filter(ind => ind.groupId === groupId);
      const column1 = document.getElementById('individualsColumn1');
      const column2 = document.getElementById('individualsColumn2');

      column1.innerHTML = '';
      column2.innerHTML = '';

      if (individuals.length === 0) {
        column1.style.width = '100%';
        column1.innerHTML = '<div style="text-align:center;color:#999;padding:40px;">该分组下暂无个体</div>';
        column2.innerHTML = '';
      } else {
        column1.style.width = 'calc(50% - 4px)';
        individuals.forEach((ind, index) => {
          const card = document.createElement('div');
          card.className = 'individual-card';
          card.innerHTML = `
            <img class="individual-card-image" src="${ind.image}" alt="${ind.title}">
            <div class="individual-card-content">
              <div class="individual-card-title">${ind.title}</div>
              <div class="individual-card-count">${ind.count} 条记录</div>
            </div>
          `;

          if (index % 2 === 0) {
            column1.appendChild(card);
          } else {
            column2.appendChild(card);
          }
        });
      }

      document.getElementById('groupDetailPage').classList.add('active');
    }

    // 排序切换
    document.querySelectorAll('.sort-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.sort-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentSort = tab.dataset.sort;
        renderCategory();
      });
    });

    // 关闭分组详情
    document.getElementById('closeGroupDetailBtn').addEventListener('click', () => {
      document.getElementById('groupDetailPage').classList.remove('active');
    });

    // 编辑分组按钮
    document.getElementById('editGroupBtn').addEventListener('click', () => {
      alert('跳转编辑分组页面');
    });

    // 加号按钮
    document.getElementById('plusBtn').addEventListener('click', () => {
      document.getElementById('addOverlay').classList.add('active');
      document.getElementById('addOptions').classList.add('active');
    });

    document.getElementById('addOverlay').addEventListener('click', closeAddOptions);
    document.getElementById('cancelAddOption').addEventListener('click', closeAddOptions);

    function closeAddOptions() {
      document.getElementById('addOverlay').classList.remove('active');
      document.getElementById('addOptions').classList.remove('active');
    }

    // 搜索页面
    document.getElementById('searchBtn').addEventListener('click', () => {
      document.getElementById('searchPage').classList.add('active');
      document.getElementById('searchInput').focus();
    });

    document.getElementById('cancelSearchBtn').addEventListener('click', () => {
      document.getElementById('searchPage').classList.remove('active');
      document.getElementById('searchInput').value = '';
    });

    // "我" 页面
    document.getElementById('profileBtn').addEventListener('click', () => {
      document.getElementById('profilePage').classList.add('active');
      document.getElementById('totalGroups').textContent = groupData.length;
      document.getElementById('totalIndividuals').textContent = groupData.reduce((sum, g) => sum + g.count, 0);
      document.getElementById('totalRecords').textContent = groupData.reduce((sum, g) => sum + g.count * 3, 0);
      document.getElementById('totalViews').textContent = groupData.reduce((sum, g) => sum + g.views, 0);
      document.getElementById('totalImages').textContent = groupData.length * 5 + ' 张';
      document.getElementById('storageSize').textContent = '25.6 MB';
    });

    document.getElementById('closeProfileBtn').addEventListener('click', () => {
      document.getElementById('profilePage').classList.remove('active');
    });

    // 底部导航
    document.getElementById('homeBtn').addEventListener('click', () => {
      window.location.href = 'plant_home_prototype.html';
    });

    document.getElementById('communityBtn').addEventListener('click', () => {
      alert('社区功能开发中...');
    });

    // 初始化
    renderCategory();
  </script>
</body>
</html>
