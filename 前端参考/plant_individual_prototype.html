<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>植物记录相机 - 个体详情</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #fff;
      max-width: 435px;
      margin: 0 auto;
      position: relative;
      min-height: 100vh;
    }

    /* ========== 顶部导航栏 ========== */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      max-width: 435px;
      margin: 0 auto;
      height: 50px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 100;
      border-bottom: 1px solid #f0f0f0;
    }

    .back-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn svg {
      width: 22px;
      height: 22px;
      fill: #333;
    }

    .top-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: #333;
    }

    /* ========== 页面内容 ========== */
    .page-content {
      padding-top: 58px;
      padding-bottom: 20px;
    }

    /* ========== 个体信息卡片 ========== */
    .individual-card {
      background: #fff;
      padding: 16px 12px;
      margin-bottom: 8px;
      display: flex;
      gap: 12px;
    }

    .individual-cover {
      width: 80px;
      height: 80px;
      border-radius: 6px;
      object-fit: cover;
      background: #e8e8e8;
      flex-shrink: 0;
    }

    .individual-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .individual-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }

    .individual-desc {
      font-size: 13px;
      color: #666;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .individual-stats {
      font-size: 12px;
      color: #999;
      margin-top: 6px;
    }

    /* ========== 时间线记录列表 ========== */
    .records-section {
      background: #fff;
      padding: 0 12px;
    }

    /* 时间线容器 */
    .timeline {
      position: relative;
    }

    /* 垂直线 - 位于日期和节点之间 */
    .timeline::before {
      content: '';
      position: absolute;
      left: 55px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: #e0e0e0;
    }

    .record-item {
      position: relative;
      padding-bottom: 24px;
    }

    .record-item:last-child {
      padding-bottom: 0;
    }

    /* 日期 - 左上角固定宽度 */
    .record-date {
      position: absolute;
      left: 0;
      top: 0;
      width: 45px;
      font-size: 11px;
      color: #999;
      text-align: right;
      line-height: 1.3;
    }

    /* 节点 - 圆点在线上 */
    .record-node {
      position: absolute;
      left: 51px;
      top: 0;
      width: 8px;
      height: 8px;
      background: #e0e0e0;
      border-radius: 50%;
      z-index: 1;
    }

    .record-item:first-child .record-node {
      background: #FF4040;
    }

    /* 记录内容 - 从节点右侧开始 */
    .record-content {
      padding-left: 70px;
    }

    .record-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 2px;
      line-height: 1.3;
    }

    .record-desc {
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    /* 图片 - 左对齐，最多3列 */
    .record-images {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-width: 260px;
    }

    .record-images img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 2px;
    }

    /* ========== 底部导航栏 ========== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 435px;
      margin: 0 auto;
      height: 50px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 0);
      border-top: 1px solid #f0f0f0;
    }

    .nav-item {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      cursor: pointer;
      padding: 8px 0;
      background: none;
      border: none;
      font-size: 12px;
      color: #999;
      position: relative;
    }

    .nav-item.active {
      color: #333;
    }

    .plus-btn .plus-icon-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: #FF4040;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(255, 64, 64, 0.3);
      border: none;
      cursor: pointer;
    }

    .plus-btn .plus-icon-wrapper svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }

    /* ========== 编辑页面 ========== */
    .edit-page {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 435px;
      margin: 0 auto;
      background: #f5f5f5;
      z-index: 200;
    }

    .edit-page.active {
      display: block;
    }

    .edit-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      max-width: 435px;
      margin: 0 auto;
      height: 50px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 201;
      border-bottom: 1px solid #f0f0f0;
    }

    .edit-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .save-btn {
      font-size: 14px;
      color: #FF4040;
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }

    .edit-content {
      padding-top: 58px;
      padding-bottom: 40px;
    }

    .edit-cover {
      width: 100%;
      background: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .edit-cover img {
      width: 100%;
      height: auto;
      display: block;
    }

    .edit-cover-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #999;
      padding: 60px;
    }

    .edit-cover-hint svg {
      width: 48px;
      height: 48px;
      fill: #ccc;
    }

    .edit-form {
      padding: 16px 12px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 14px;
      color: #333;
      margin-bottom: 8px;
      display: block;
      font-weight: 500;
    }

    .form-label.required::after {
      content: ' *';
      color: #FF4040;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #eee;
      border-radius: 4px;
      font-size: 14px;
      background: #fff;
    }

    .form-input:focus {
      outline: none;
      border-color: #FF4040;
    }

    textarea.form-input {
      min-height: 100px;
      resize: vertical;
    }

    .delete-btn {
      width: 100%;
      padding: 14px;
      background: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      color: #FF4040;
      cursor: pointer;
      margin-top: 24px;
      font-weight: 500;
    }

    /* ========== 添加选项弹窗 ========== */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 250;
    }

    .overlay.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    .add-options {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 411px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      z-index: 300;
      display: none;
    }

    .add-options.active {
      display: block;
    }

    .add-option {
      width: 100%;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: #333;
    }

    .add-option:not(:last-child) {
      border-bottom: 1px solid #f5f5f5;
    }

    .add-option svg {
      width: 20px;
      height: 20px;
      fill: #4CAF50;
    }

    .add-option.cancel {
      color: #999;
      margin-top: 6px;
      border-top: 6px solid #f5f5f5;
      border-bottom: none;
    }

    .add-option.cancel svg {
      fill: #999;
    }
  </style>
</head>
<body>

  <!-- ========== 个体详情页 ========== -->
  <div id="individualPage">
    <!-- 顶部栏 -->
    <div class="top-bar">
      <button class="back-btn" id="backBtn">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <span class="top-title" id="pageTitle">个体名称</span>
      <div class="top-right">
        <button class="icon-btn" id="editBtn" title="编辑">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </button>
        <button class="icon-btn" id="moreBtn" title="更多">
          <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </button>
      </div>
    </div>

    <!-- 页面内容 -->
    <div class="page-content">
      <!-- 个体信息卡片 -->
      <div class="individual-card">
        <img class="individual-cover" id="individualCover" src="" alt="">
        <div class="individual-info">
          <div class="individual-title" id="individualTitle"></div>
          <div class="individual-desc" id="individualDesc"></div>
          <div class="individual-stats" id="individualStats"></div>
        </div>
      </div>

      <!-- 时间线记录列表 -->
      <div class="records-section">
        <div class="timeline" id="timeline">
          <!-- 由 JS 渲染 -->
        </div>
      </div>
    </div>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <button class="nav-item" id="homeBtn">
        <span>全部</span>
      </button>
      <button class="nav-item" id="categoryBtn">
        <span>分组</span>
      </button>
      <button class="nav-item plus-btn" id="plusBtn">
        <div class="plus-icon-wrapper">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </div>
      </button>
      <button class="nav-item" id="communityBtn">
        <span>社区</span>
      </button>
      <button class="nav-item" id="profileBtn">
        <span>我</span>
      </button>
    </nav>
  </div>

  <!-- ========== 添加选项弹窗 ========== -->
  <div class="overlay" id="addOverlay"></div>
  <div class="add-options" id="addOptions">
    <button class="add-option" id="addRecordOption">
      <svg viewBox="0 0 24 24"><path d="M12 12m-3.2 0a3.2 3.2 0 1 0 6.4 0a3.2 3.2 0 1 0-6.4 0M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
      添加记录
    </button>
    <button class="add-option cancel" id="cancelAddOption">
      取消
    </button>
  </div>

  <!-- ========== 编辑页面 ========== -->
  <div class="edit-page" id="editPage">
    <header class="edit-header">
      <button class="back-btn" id="closeEditBtn">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <span class="edit-title">编辑个体</span>
      <button class="save-btn" id="saveEditBtn">保存</button>
    </header>

    <div class="edit-content">
      <div class="edit-cover">
        <img src="" alt="封面" id="editCoverImg" style="display: none;">
        <div class="edit-cover-hint" id="editCoverHint">
          <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
          <span>点击选择图片</span>
        </div>
      </div>

      <div class="edit-form">
        <div class="form-group">
          <label class="form-label required">标题</label>
          <input type="text" class="form-input" id="editTitle" placeholder="请输入个体标题" maxlength="50">
        </div>

        <div class="form-group">
          <label class="form-label">描述</label>
          <textarea class="form-input" id="editDesc" placeholder="请输入个体描述" maxlength="500"></textarea>
        </div>

        <button class="delete-btn" id="deleteBtn">删除个体</button>
      </div>
    </div>
  </div>

  <script>
    // 示例数据
    const individualData = {
      id: 1,
      groupId: 1,
      title: '绿萝养护日记',
      desc: '记录绿萝从水培到土培的全过程，分享养护经验和心得体会。',
      cover: 'https://picsum.photos/200/200?random=100',
      stats: '12 条记录 · 3456 次浏览'
    };

    const recordsData = [
      {
        id: 1,
        date: '03月31日',
        title: '新叶子',
        desc: '又长了一片新叶子',
        images: ['https://picsum.photos/200/200?random=1']
      },
      {
        id: 2,
        date: '03月31日',
        title: '长势良好',
        desc: '这周长得很快',
        images: ['https://picsum.photos/200/200?random=2', 'https://picsum.photos/200/200?random=3', 'https://picsum.photos/200/200?random=4', 'https://picsum.photos/200/200?random=5', 'https://picsum.photos/200/200?random=6']
      },
      {
        id: 3,
        date: '03月25日',
        title: '换水',
        desc: '给水培的绿萝换了水',
        images: ['https://picsum.photos/200/200?random=7', 'https://picsum.photos/200/200?random=8']
      },
      {
        id: 4,
        date: '03月20日',
        title: '发现新芽',
        desc: '根部冒出了一个小芽',
        images: ['https://picsum.photos/200/200?random=9']
      },
      {
        id: 5,
        date: '03月15日',
        title: '开始水培',
        desc: '从土培转水培，期待变化',
        images: ['https://picsum.photos/200/200?random=10', 'https://picsum.photos/200/200?random=11', 'https://picsum.photos/200/200?random=12']
      },
    ];

    // 渲染个体信息
    function renderIndividualInfo() {
      document.getElementById('pageTitle').textContent = individualData.title;
      document.getElementById('individualCover').src = individualData.cover;
      document.getElementById('individualTitle').textContent = individualData.title;
      document.getElementById('individualDesc').textContent = individualData.desc;
      document.getElementById('individualStats').textContent = individualData.stats;
    }

    // 渲染时间线记录列表
    function renderRecords() {
      const timeline = document.getElementById('timeline');
      timeline.innerHTML = '';

      recordsData.forEach((record, index) => {
        const item = document.createElement('div');
        item.className = 'record-item';

        // 生成图片HTML
        let imagesHtml = '';
        if (record.images && record.images.length > 0) {
          const imagesContent = record.images.map(img => `<img src="${img}" alt="">`).join('');
          imagesHtml = `<div class="record-images">${imagesContent}</div>`;
        }

        item.innerHTML = `
          <div class="record-date">${record.date}</div>
          <div class="record-node"></div>
          <div class="record-content">
            <div class="record-title">${record.title}</div>
            <div class="record-desc">${record.desc}</div>
            ${imagesHtml}
          </div>
        `;

        timeline.appendChild(item);
      });
    }

    // 打开编辑页面
    function openEditPage() {
      document.getElementById('editCoverImg').src = individualData.cover;
      document.getElementById('editCoverImg').style.display = 'block';
      document.getElementById('editCoverHint').style.display = 'none';
      document.getElementById('editTitle').value = individualData.title;
      document.getElementById('editDesc').value = individualData.desc;
      document.getElementById('editPage').classList.add('active');
    }

    // 返回按钮
    document.getElementById('backBtn').addEventListener('click', () => {
      history.back();
    });

    // 编辑按钮
    document.getElementById('editBtn').addEventListener('click', openEditPage);

    // 关闭编辑页面
    document.getElementById('closeEditBtn').addEventListener('click', () => {
      document.getElementById('editPage').classList.remove('active');
    });

    // 保存编辑
    document.getElementById('saveEditBtn').addEventListener('click', () => {
      individualData.title = document.getElementById('editTitle').value;
      individualData.desc = document.getElementById('editDesc').value;
      renderIndividualInfo();
      document.getElementById('editPage').classList.remove('active');
    });

    // 删除个体
    document.getElementById('deleteBtn').addEventListener('click', () => {
      if (confirm('确定要删除该个体吗？个体下的所有记录也会被删除。')) {
        alert('删除成功，返回上一页');
        document.getElementById('editPage').classList.remove('active');
      }
    });

    // 加号按钮
    document.getElementById('plusBtn').addEventListener('click', () => {
      document.getElementById('addOverlay').classList.add('active');
      document.getElementById('addOptions').classList.add('active');
    });

    document.getElementById('addOverlay').addEventListener('click', closeAddOptions);
    document.getElementById('cancelAddOption').addEventListener('click', closeAddOptions);

    function closeAddOptions() {
      document.getElementById('addOverlay').classList.remove('active');
      document.getElementById('addOptions').classList.remove('active');
    }

    document.getElementById('addRecordOption').addEventListener('click', () => {
      alert('跳转添加记录页面');
      closeAddOptions();
    });

    // 更多按钮
    document.getElementById('moreBtn').addEventListener('click', () => {
      alert('显示更多选项菜单');
    });

    // 底部导航
    document.getElementById('homeBtn').addEventListener('click', () => {
      window.location.href = 'plant_home_prototype.html';
    });

    document.getElementById('categoryBtn').addEventListener('click', () => {
      window.location.href = 'plant_category_prototype.html';
    });

    document.getElementById('communityBtn').addEventListener('click', () => {
      alert('社区功能开发中...');
    });

    document.getElementById('profileBtn').addEventListener('click', () => {
      alert('跳转个人中心');
    });

    // 初始化
    renderIndividualInfo();
    renderRecords();
  </script>
</body>
</html>
