<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>植物记录相机 - 首页</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #f5f5f5;
      max-width: 435px;
      margin: 0 auto;
      position: relative;
      min-height: 100vh;
    }

    /* ========== 顶部栏 ========== */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      max-width: 435px;
      margin: 0 auto;
      height: 50px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 100;
    }

    .top-left {
      width: 40px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .top-left svg {
      width: 22px;
      height: 22px;
      fill: #333;
      cursor: pointer;
    }

    .sort-tabs {
      display: flex;
      gap: 30px;
    }

    .sort-tab {
      font-size: 16px;
      color: #999;
      cursor: pointer;
      padding: 4px 0;
      position: relative;
      background: none;
      border: none;
      font-weight: normal;
    }

    .sort-tab.active {
      color: #333;
      font-weight: 600;
    }

    .sort-tab.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2px;
      background: #FF4040;
      border-radius: 1px;
    }

    .top-right {
      width: 40px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .search-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-btn svg {
      width: 20px;
      height: 20px;
      fill: #666;
    }

    /* ========== 编辑模式 ========== */
    .edit-mode .edit-btn-wrapper {
      display: flex !important;
    }

    .edit-btn-wrapper {
      display: none;
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
    }

    .card-edit-btn {
      width: 28px;
      height: 28px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-edit-btn svg {
      width: 14px;
      height: 14px;
      fill: #fff;
    }

    /* ========== 瀑布流 ========== */
    .masonry-container {
      padding: 8px;
      padding-top: 58px;
      padding-bottom: 70px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .masonry-column {
      width: calc(50% - 4px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card {
      background: #fff;
      border-radius: 4px;
      overflow: hidden;
      break-inside: avoid;
      position: relative;
    }

    .card-image {
      width: 100%;
      display: block;
    }

    .card-content {
      padding: 10px 8px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.3;
    }

    .card-desc {
      font-size: 12px;
      color: #999;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-author {
      font-size: 12px;
      color: #999;
    }

    .card-likes {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .card-likes svg {
      width: 12px;
      height: 12px;
      fill: #ccc;
    }

    .card-likes span {
      font-size: 11px;
      color: #ccc;
    }

    /* ========== 底部导航栏 ========== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 435px;
      margin: 0 auto;
      height: 50px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 0);
      border-top: 1px solid #f0f0f0;
    }

    .nav-item {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      cursor: pointer;
      padding: 8px 0;
      background: none;
      border: none;
      font-size: 12px;
      color: #999;
      position: relative;
    }

    .nav-item.active {
      color: #333;
    }

    /* 加号按钮特殊样式 */
    .nav-item.plus-btn {
      position: relative;
    }

    .plus-btn .plus-icon-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: #FF4040;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(255, 64, 64, 0.3);
      border: none;
      cursor: pointer;
    }

    .plus-btn .plus-icon-wrapper svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }

    /* 消息红点 */
    .nav-item.message-btn::after {
      content: '';
      position: absolute;
      top: 6px;
      right: calc(50% - 16px);
      width: 6px;
      height: 6px;
      background: #FF4040;
      border-radius: 50%;
    }

    /* ========== 编辑页面 ========== */
    .edit-page {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 435px;
      margin: 0 auto;
      background: #f5f5f5;
      z-index: 200;
    }

    .edit-page.active {
      display: block;
    }

    .edit-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      max-width: 435px;
      margin: 0 auto;
      height: 50px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 201;
      border-bottom: 1px solid #f0f0f0;
    }

    .back-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
      fill: #333;
    }

    .edit-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .save-btn {
      font-size: 14px;
      color: #FF4040;
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }

    .edit-content {
      padding-top: 58px;
      padding-bottom: 40px;
    }

    .edit-cover {
      width: 100%;
      background: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .edit-cover img {
      width: 100%;
      height: auto;
      display: block;
    }

    .edit-cover-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #999;
      padding: 60px;
    }

    .edit-cover-hint svg {
      width: 48px;
      height: 48px;
      fill: #ccc;
    }

    .edit-form {
      padding: 16px 12px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 14px;
      color: #333;
      margin-bottom: 8px;
      display: block;
      font-weight: 500;
    }

    .form-label.required::after {
      content: ' *';
      color: #FF4040;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #eee;
      border-radius: 4px;
      font-size: 14px;
      background: #fff;
    }

    .form-input:focus {
      outline: none;
      border-color: #FF4040;
    }

    textarea.form-input {
      min-height: 100px;
      resize: vertical;
    }

    .delete-btn {
      width: 100%;
      padding: 14px;
      background: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      color: #FF4040;
      cursor: pointer;
      margin-top: 24px;
      font-weight: 500;
    }

    /* ========== 添加页面 ========== */
    .add-page {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 435px;
      margin: 0 auto;
      background: #f5f5f5;
      z-index: 200;
    }

    .add-page.active {
      display: block;
    }

    .add-options {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 411px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      z-index: 300;
      display: none;
    }

    .add-options.active {
      display: block;
    }

    .add-option {
      width: 100%;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: #333;
    }

    .add-option:not(:last-child) {
      border-bottom: 1px solid #f5f5f5;
    }

    .add-option svg {
      width: 20px;
      height: 20px;
      fill: #4CAF50;
    }

    .add-option.cancel {
      color: #999;
      margin-top: 6px;
      border-top: 6px solid #f5f5f5;
      border-bottom: none;
    }

    .add-option.cancel svg {
      fill: #999;
    }

    /* ========== 搜索页面 ========== */
    .search-page {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 435px;
      margin: 0 auto;
      background: #fff;
      z-index: 200;
    }

    .search-page.active {
      display: block;
    }

    .search-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      max-width: 435px;
      margin: 0 auto;
      height: 50px;
      background: #fff;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 12px;
      z-index: 201;
      border-bottom: 1px solid #f0f0f0;
    }

    .search-input {
      flex: 1;
      height: 32px;
      padding: 0 14px;
      border: none;
      background: #f5f5f5;
      border-radius: 16px;
      font-size: 13px;
    }

    .search-input:focus {
      outline: none;
    }

    .cancel-search {
      font-size: 14px;
      color: #666;
      background: none;
      border: none;
      cursor: pointer;
    }

    .search-content {
      padding-top: 58px;
    }

    .search-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 20px;
      color: #999;
    }

    .search-empty svg {
      width: 64px;
      height: 64px;
      fill: #ddd;
      margin-bottom: 16px;
    }

    /* ========== "我" 页面 ========== */
    .profile-page {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 435px;
      margin: 0 auto;
      background: #f5f5f5;
      z-index: 200;
    }

    .profile-page.active {
      display: block;
    }

    .profile-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      max-width: 435px;
      margin: 0 auto;
      height: 50px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      z-index: 201;
      border-bottom: 1px solid #f0f0f0;
    }

    .profile-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .profile-content {
      padding-top: 58px;
      padding-bottom: 20px;
    }

    .profile-stats {
      background: #fff;
      padding: 20px;
      display: flex;
      justify-content: space-around;
      margin-bottom: 1px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }

    .stat-label {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }

    .profile-card {
      background: #fff;
      margin-bottom: 1px;
    }

    .profile-card-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      padding: 14px 12px;
      border-bottom: 1px solid #f5f5f5;
    }

    .profile-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 12px;
      background: #fff;
      margin-bottom: 1px;
    }

    .profile-list-item span:first-child {
      font-size: 14px;
      color: #333;
    }

    .profile-list-item span:last-child {
      font-size: 14px;
      color: #ccc;
    }

    /* ========== 动画 ========== */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 250;
    }

    .overlay.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }
  </style>
</head>
<body>

  <!-- ========== 首页 ========== -->
  <div id="homePage">
    <!-- 顶部栏 -->
    <div class="top-bar">
      <div class="top-left">
        <!-- 收藏/关注图标 -->
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>

      <div class="sort-tabs">
        <button class="sort-tab" data-sort="default">默认</button>
        <button class="sort-tab active" data-sort="hot">最热</button>
        <button class="sort-tab" data-sort="latest">最新</button>
      </div>

      <div class="top-right">
        <button class="search-btn" id="searchBtn" title="搜索">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </div>
    </div>

    <!-- 瀑布流内容 -->
    <div class="masonry-container" id="masonryContainer">
      <!-- 左列 -->
      <div class="masonry-column" id="column1"></div>
      <!-- 右列 -->
      <div class="masonry-column" id="column2"></div>
    </div>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <button class="nav-item active" id="homeBtn">
        <span>全部</span>
      </button>
      <button class="nav-item" id="marketBtn">
        <span>分组</span>
      </button>
      <button class="nav-item plus-btn" id="plusBtn">
        <div class="plus-icon-wrapper">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </div>
      </button>
      <button class="nav-item message-btn" id="messageBtn">
        <span>社区</span>
      </button>
      <button class="nav-item" id="profileBtn">
        <span>我</span>
      </button>
    </nav>
  </div>

  <!-- ========== 编辑页面 ========== -->
  <div class="edit-page" id="editPage">
    <header class="edit-header">
      <button class="back-btn" id="closeEditBtn">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <span class="edit-title">编辑分组</span>
      <button class="save-btn" id="saveEditBtn">保存</button>
    </header>

    <div class="edit-content">
      <div class="edit-cover">
        <img src="" alt="封面" id="editCoverImg" style="display: none;">
        <div class="edit-cover-hint" id="editCoverHint">
          <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
          <span>点击选择图片</span>
        </div>
      </div>

      <div class="edit-form">
        <div class="form-group">
          <label class="form-label required">标题</label>
          <input type="text" class="form-input" id="editTitle" placeholder="请输入分组标题" maxlength="50">
        </div>

        <div class="form-group">
          <label class="form-label">描述</label>
          <textarea class="form-input" id="editDesc" placeholder="请输入分组描述" maxlength="500"></textarea>
        </div>

        <button class="delete-btn" id="deleteGroupBtn">删除分组</button>
      </div>
    </div>
  </div>

  <!-- ========== 添加选项弹窗 ========== -->
  <div class="overlay" id="addOverlay"></div>
  <div class="add-options" id="addOptions">
    <button class="add-option" id="addGroupOption">
      <svg viewBox="0 0 24 24"><path d="M12 22c4.97 0 9-4.03 9-9-4.97 0-9 4.03-9 9zM5.6 10.25c0 1.38 1.12 2.5 2.5 2.5.53 0 1.01-.16 1.42-.44l-.02.19c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5l-.02-.19c.4.28.89.44 1.42.44 1.38 0 2.5-1.12 2.5-2.5 0-1-.59-1.85-1.43-2.25.84-.4 1.43-1.25 1.43-2.25 0-1.38-1.12-2.5-2.5-2.5-.53 0-1.01.16-1.42.44l.02-.19C14.5 4.12 13.38 3 12 3S9.5 4.12 9.5 5.5l.02.19c-.4-.28-.89-.44-1.42-.44-1.38 0-2.5 1.12-2.5 2.5 0 1 .59 1.85 1.43 2.25-.84.4-1.43 1.25-1.43 2.25zM12 5.5c1.38 0 2.5 1.12 2.5 2.5s-1.12 2.5-2.5 2.5S9.5 9.38 9.5 8s1.12-2.5 2.5-2.5zM3 13c0 4.97 4.03 9 9 9 0-4.97-4.03-9-9-9z"/></svg>
      新建分组
    </button>
    <button class="add-option" id="addIndividualOption">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      新建个体
    </button>
    <button class="add-option cancel" id="cancelAddOption">
      取消
    </button>
  </div>

  <!-- ========== 搜索页面 ========== -->
  <div class="search-page" id="searchPage">
    <header class="search-header">
      <input type="text" class="search-input" id="searchInput" placeholder="搜索">
      <button class="cancel-search" id="cancelSearchBtn">取消</button>
    </header>
    <div class="search-content">
      <div class="search-empty">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <p>输入关键词搜索</p>
      </div>
    </div>
  </div>

  <!-- ========== "我" 页面 ========== -->
  <div class="profile-page" id="profilePage">
    <header class="profile-header">
      <button class="back-btn" id="closeProfileBtn" style="position: absolute; left: 12px;">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <span class="profile-title">我</span>
    </header>
    <div class="profile-content">
      <div class="profile-stats">
        <div class="stat-item">
          <div class="stat-value" id="totalGroups">0</div>
          <div class="stat-label">分组</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="totalIndividuals">0</div>
          <div class="stat-label">个体</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="totalRecords">0</div>
          <div class="stat-label">记录</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="totalViews">0</div>
          <div class="stat-label">浏览</div>
        </div>
      </div>

      <div class="profile-card">
        <div class="profile-card-title">存储统计</div>
      </div>
      <div class="profile-list-item">
        <span>图片数量</span>
        <span id="totalImages">0 张</span>
      </div>
      <div class="profile-list-item">
        <span>占用空间</span>
        <span id="storageSize">0 MB</span>
      </div>

      <div class="profile-card" style="margin-top: 10px;">
        <div class="profile-card-title">关于</div>
        <div class="profile-list-item">
          <span>版本</span>
          <span>1.0.0</span>
        </div>
        <div class="profile-list-item">
          <span>应用名称</span>
          <span>植物记录相机</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 示例数据
    const sampleData = [
      { id: 1, title: '多肉植物', desc: '各种各样的多肉植物集合，记录它们的成长历程', image: 'https://picsum.photos/400/500?random=1', views: 1234, author: '植物爱好者' },
      { id: 2, title: '绿萝养护', desc: '绿萝的日常养护和水培技巧分享', image: 'https://picsum.photos/400/400?random=2', views: 856, author: '养花达人' },
      { id: 3, title: '月季花期', desc: '春天月季花开的美丽瞬间', image: 'https://picsum.photos/400/600?random=3', views: 2341, author: '花园主人' },
      { id: 4, title: '仙人掌', desc: '耐旱易养的仙人掌植物', image: 'https://picsum.photos/400/450?random=4', views: 567, author: '多肉控' },
      { id: 5, title: '吊兰繁殖', desc: '吊兰的分株和繁殖方法', image: 'https://picsum.photos/400/400?random=5', views: 1892, author: '绿植家' },
      { id: 6, title: '龟背竹', desc: '网红绿植龟背竹的养护心得', image: 'https://picsum.photos/400/550?random=6', views: 3421, author: '室内植物' },
      { id: 7, title: '虎皮兰', desc: '净化空气的虎皮兰', image: 'https://picsum.photos/400/380?random=7', views: 743, author: '空气净化' },
      { id: 8, title: '琴叶榕', desc: '大型观叶植物琴叶榕', image: 'https://picsum.photos/400/500?random=8', views: 1123, author: '绿植达人' },
    ];

    let currentSort = 'discover';
    let isEditMode = false;
    let currentEditId = null;

    // 渲染瀑布流
    function renderMasonry() {
      const column1 = document.getElementById('column1');
      const column2 = document.getElementById('column2');

      // 排序
      let sortedData = [...sampleData];
      if (currentSort === 'hot') {
        sortedData.sort((a, b) => b.views - a.views);
      } else if (currentSort === 'latest') {
        sortedData.sort((a, b) => b.id - a.id);
      }

      // 清空
      column1.innerHTML = '';
      column2.innerHTML = '';

      sortedData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          ${isEditMode ? `<div class="edit-btn-wrapper"><button class="card-edit-btn" data-id="${item.id}"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button></div>` : ''}
          <img class="card-image" src="${item.image}" alt="${item.title}" loading="lazy">
          <div class="card-content">
            <div class="card-title">${item.title}</div>
            <div class="card-desc">${item.desc}</div>
            <div class="card-footer">
              <span class="card-author">${item.author}</span>
              <div class="card-likes">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span>${item.views}</span>
              </div>
            </div>
          </div>
        `;

        // 点击卡片编辑
        if (isEditMode) {
          card.querySelector('.card-edit-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            openEditPage(item.id);
          });
        }

        // 交替添加到两列
        if (index % 2 === 0) {
          column1.appendChild(card);
        } else {
          column2.appendChild(card);
        }
      });
    }

    // 排序切换
    document.querySelectorAll('.sort-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.sort-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentSort = tab.dataset.sort;
        renderMasonry();
      });
    });

    // 模拟编辑模式 - 通过长按卡片触发
    let editModeBtnTimer = null;
    document.getElementById('homePage').addEventListener('contextmenu', (e) => {
      e.preventDefault();
      isEditMode = !isEditMode;
      document.body.classList.toggle('edit-mode', isEditMode);
      renderMasonry();
    });

    // 双击进入编辑模式
    let lastTap = 0;
    document.getElementById('masonryContainer').addEventListener('click', (e) => {
      const now = Date.now();
      if (now - lastTap < 300) {
        // 双击，找到被点击的卡片
        const card = e.target.closest('.card');
        if (card) {
          isEditMode = true;
          document.body.classList.add('edit-mode');
          renderMasonry();
        }
      }
      lastTap = now;
    });

    // 打开编辑页面
    function openEditPage(id) {
      const item = sampleData.find(d => d.id === id);
      if (!item) return;

      currentEditId = id;
      document.getElementById('editCoverImg').src = item.image;
      document.getElementById('editCoverImg').style.display = 'block';
      document.getElementById('editCoverHint').style.display = 'none';
      document.getElementById('editTitle').value = item.title;
      document.getElementById('editDesc').value = item.desc;
      document.getElementById('editPage').classList.add('active');
    }

    document.getElementById('closeEditBtn').addEventListener('click', () => {
      document.getElementById('editPage').classList.remove('active');
      currentEditId = null;
    });

    // 保存编辑
    document.getElementById('saveEditBtn').addEventListener('click', () => {
      if (currentEditId) {
        const item = sampleData.find(d => d.id === currentEditId);
        if (item) {
          item.title = document.getElementById('editTitle').value;
          item.desc = document.getElementById('editDesc').value;
        }
      }
      document.getElementById('editPage').classList.remove('active');
      isEditMode = false;
      document.body.classList.remove('edit-mode');
      renderMasonry();
    });

    // 删除分组
    document.getElementById('deleteGroupBtn').addEventListener('click', () => {
      if (currentEditId && confirm('确定要删除该分组吗？分组下的所有个体和记录也会被删除。')) {
        const index = sampleData.findIndex(d => d.id === currentEditId);
        if (index > -1) {
          sampleData.splice(index, 1);
        }
        document.getElementById('editPage').classList.remove('active');
        isEditMode = false;
        document.body.classList.remove('edit-mode');
        renderMasonry();
      }
    });

    // 加号按钮
    document.getElementById('plusBtn').addEventListener('click', () => {
      document.getElementById('addOverlay').classList.add('active');
      document.getElementById('addOptions').classList.add('active');
    });

    document.getElementById('addOverlay').addEventListener('click', closeAddOptions);
    document.getElementById('cancelAddOption').addEventListener('click', closeAddOptions);

    function closeAddOptions() {
      document.getElementById('addOverlay').classList.remove('active');
      document.getElementById('addOptions').classList.remove('active');
    }

    document.getElementById('addGroupOption').addEventListener('click', () => {
      alert('跳转新建分组页面');
      closeAddOptions();
    });

    document.getElementById('addIndividualOption').addEventListener('click', () => {
      alert('跳转新建个体页面');
      closeAddOptions();
    });

    // 搜索页面
    document.getElementById('searchBtn').addEventListener('click', () => {
      document.getElementById('searchPage').classList.add('active');
      document.getElementById('searchInput').focus();
    });

    document.getElementById('cancelSearchBtn').addEventListener('click', () => {
      document.getElementById('searchPage').classList.remove('active');
      document.getElementById('searchInput').value = '';
    });

    // "我" 页面
    document.getElementById('profileBtn').addEventListener('click', () => {
      document.getElementById('profilePage').classList.add('active');

      // 更新统计数据
      document.getElementById('totalGroups').textContent = sampleData.length;
      document.getElementById('totalIndividuals').textContent = sampleData.length * 2;
      document.getElementById('totalRecords').textContent = sampleData.length * 5;
      document.getElementById('totalViews').textContent = sampleData.reduce((sum, d) => sum + d.views, 0);
      document.getElementById('totalImages').textContent = sampleData.length * 3 + ' 张';
      document.getElementById('storageSize').textContent = '25.6 MB';
    });

    document.getElementById('closeProfileBtn').addEventListener('click', () => {
      document.getElementById('profilePage').classList.remove('active');
    });

    // 底部导航切换
    document.getElementById('homeBtn').addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById('homeBtn').classList.add('active');
    });

    document.getElementById('marketBtn').addEventListener('click', () => {
      alert('市集功能开发中...');
    });

    document.getElementById('messageBtn').addEventListener('click', () => {
      alert('消息功能开发中...');
    });

    // 初始化
    renderMasonry();
  </script>
</body>
</html>
